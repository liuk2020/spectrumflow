[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "spectrumflow"
version = "0.1.0"
description = "Scientific data processing and plotting for stellarator research"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.23", "scipy>=1.9"]

[project.optional-dependencies]
netcdf = ["netCDF4>=1.6"]
plot = ["matplotlib>=3.6", "cmap"]
dev = ["pytest>=7", "build>=1", "matplotlib>=3.6", "cmap", "netCDF4>=1.6"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["spectrumflow*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
