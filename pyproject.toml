[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "spectrumflow"
version = "0.0.0"
description = "Scientific data processing and plotting for stellarator research"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
where = ["src"]
